<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Party Budget Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <h1>🎉 Party Budget Planner</h1>

        <form action="/generate-party" method="post" class="card">
            <label>Total Budget (₹):</label>
            <input type="number" name="total_budget" required>

            <label>Party Type:</label>
            <select name="party_type" required>
                <option value="Birthday">Birthday</option>
                <option value="Wedding">Wedding</option>
                <option value="Corporate">Corporate</option>
                <option value="Anniversary">Anniversary</option>
                <option value="Housewarming">Housewarming</option>
            </select>

            <label>Number of Guests:</label>
            <input type="number" name="num_guests" required>

            <label>Venue Type (optional):</label>
            <input type="text" name="venue_type" placeholder="e.g., Home, Banquet, Outdoor">

            <label><input type="checkbox" name="needs_catering" value="true" style="width:auto;"> Needs Catering</label>
            <label><input type="checkbox" name="needs_decoration" value="true" style="width:auto;"> Needs Decoration</label>
            <label><input type="checkbox" name="needs_entertainment" value="true" style="width:auto;"> Needs Entertainment</label>

            <label>Additional Requirements:</label>
            <textarea name="additional_requirements" rows="3" placeholder="e.g., Vegetarian menu, theme colors..."></textarea>

            <button type="submit">Generate Recommendations</button>
        </form>

        {% if result %}
            {% include "_result_display.html" %}
        {% endif %}
    </div>
</body>
</html>
